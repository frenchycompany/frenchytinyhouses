# Frenchy Tiny Houses — vhost public (frenchytinyhouses.fr)
#
# Sert le build statique Astro depuis /var/www/frenchytinyhouses/dist/.
# HTTPS géré par certbot --nginx (les blocs TLS seront ajoutés automatiquement).
# Voir infra/README.md pour la procédure d'installation complète.

server {
    listen 80;
    listen [::]:80;
    server_name frenchytinyhouses.fr www.frenchytinyhouses.fr;

    root /var/www/frenchytinyhouses/dist;
    index index.html;

    # Redirection www → apex
    if ($host = www.frenchytinyhouses.fr) {
        return 301 https://frenchytinyhouses.fr$request_uri;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro build directory: /index.html, /concept/index.html, etc.
    # Try the path, then path+/index.html, then 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache long sur les assets versionnés (hash dans le nom)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Page d'erreur basique
    error_page 404 /404.html;

    # Logs
    access_log /var/log/nginx/frenchytinyhouses.access.log;
    error_log  /var/log/nginx/frenchytinyhouses.error.log;
}
