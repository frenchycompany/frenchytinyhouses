# Frenchy Tiny Houses — vhost investisseurs (invest.frenchytinyhouses.fr)
#
# Sert le même build que le vhost public, mais :
#  - HTTP Basic Auth sur tout le sous-domaine
#  - / redirigé vers /investisseurs/
#  - robots.txt servi en mode "Disallow: /" pour empêcher toute indexation
#  - en-têtes anti-cache et noindex en defense-in-depth (le HTML porte déjà
#    une <meta robots noindex>, mais on les ajoute aussi côté serveur)
#
# Préalable : créer le fichier htpasswd. Voir infra/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name invest.frenchytinyhouses.fr;

    root /var/www/frenchytinyhouses/dist;
    index index.html;

    # Basic Auth sur tout le serveur
    auth_basic           "Frenchy Tiny Houses — Espace investisseurs";
    auth_basic_user_file /etc/nginx/htpasswd-invest;

    # Headers anti-indexation, application large
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # robots.txt local au sous-domaine — bloque tout, même si le HTML est public.
    location = /robots.txt {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Redirection racine → /investisseurs/
    location = / {
        return 302 /investisseurs/;
    }

    # Sert toute l'arborescence Astro standard (les pages /investisseurs/*
    # ainsi que /dossier/*, /_astro/*, /favicon.svg sont accessibles une fois
    # authentifié, ce qui est ce qu'on veut puisque les pages investisseurs
    # référencent ces assets).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_astro/ {
        expires 1d;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    access_log /var/log/nginx/invest.frenchytinyhouses.access.log;
    error_log  /var/log/nginx/invest.frenchytinyhouses.error.log;
}
